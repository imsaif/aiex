<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-label="Share of audit advice that guessed, before and after the fix. Tuned 41 screens: 80 percent before, 68 percent after. Fresh 19 screens: 92 percent before, 88 percent after.">
  <rect x="1" y="1" width="798" height="378" rx="14" fill="#ffffff" stroke="#e2e4ea" stroke-width="2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="52" font-size="20" font-weight="700" fill="#162036">Advice that guessed instead of describing the screen</text>
    <text x="40" y="78" font-size="15" fill="#5b6478">Share of all advice in the audit, before and after the fix</text>

    <!-- legend -->
    <rect x="520" y="96" width="14" height="14" rx="3" fill="#c9cdd8"/>
    <text x="542" y="108" font-size="14" fill="#5b6478">Before</text>
    <rect x="610" y="96" width="14" height="14" rx="3" fill="#2f54d6"/>
    <text x="632" y="108" font-size="14" fill="#5b6478">After the fix</text>

    <!-- row 1: tuned 41 -->
    <text x="40" y="160" font-size="16" font-weight="600" fill="#162036">41 screens we tuned on</text>
    <rect x="260" y="140" width="400" height="22" rx="4" fill="#c9cdd8"/>
    <text x="670" y="157" font-size="15" font-weight="600" fill="#162036">80%</text>
    <rect x="260" y="168" width="340" height="22" rx="4" fill="#2f54d6"/>
    <text x="610" y="185" font-size="15" font-weight="600" fill="#162036">68%</text>
    <text x="40" y="182" font-size="13" fill="#5b6478">93 of 116 → 73 of 107</text>

    <!-- row 2: fresh 19 -->
    <text x="40" y="250" font-size="16" font-weight="600" fill="#162036">19 fresh screens</text>
    <rect x="260" y="230" width="460" height="22" rx="4" fill="#c9cdd8"/>
    <text x="730" y="247" font-size="15" font-weight="600" fill="#162036">92%</text>
    <rect x="260" y="258" width="440" height="22" rx="4" fill="#2f54d6"/>
    <text x="710" y="275" font-size="15" font-weight="600" fill="#162036">88%</text>
    <text x="40" y="272" font-size="13" fill="#5b6478">60 of 65 → 50 of 57</text>

    <line x1="40" y1="312" x2="760" y2="312" stroke="#e2e4ea" stroke-width="1.5"/>
    <text x="40" y="344" font-size="14" fill="#5b6478">The drop is smaller on screens the fix never saw: part of it only suited the examples it was tuned on.</text>
  </g>
</svg>
